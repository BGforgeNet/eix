      - {name: y, type: number}
      - {name: z, type: number}
      - {name: radius, type: number}
      - {name: r, type: number}
      - {name: g, type: number}
      - {name: b, type: number}
    category: world
    source: game
    description: >-
      Creates a point light of the given color at (x, y, z). A torch or a campfire at night is a light; a dim one
      darkens a dense forest by day.
