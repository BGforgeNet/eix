      music off, `1` on.
  - name: PlayMusic
    kind: command
    returns: void
    params:
      - {name: player, type: number}
      - {name: name, type: string}
    category: world
    source: spelladdon
    option: "[gameplay] playmusictrans"
    description: >-
      Values 1 and 2: the name `"0"` or `"1"` re-selects the local map's music theme and sets the music system's level
      to the digit. The first character selects this behavior. Value 1 uses the map's theme, value 2 its alternative
      name field. Other text, or no map or music system, uses normal handling.
    note: >-
      without a map or a music system, does what the game does (the original crashes)
  - name: RunWorldTime
