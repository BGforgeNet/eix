      - {name: z, type: number}
      - {name: radius, type: number}
      - {name: type, type: string}
    category: world
    source: game
    description: >-
      Creates a particle source of the given type at (x, y, z). A negative radius flips the source upside down.
  - name: CreatePointLight
    kind: command
