    description: >-
      Returns how dark it is, from 0 to 1, by the game's hour of day: 0 from 8:00 to 20:00, rising evenly from 0 at
      20:00 to 1 at 24:00, and 1 from 0:00 until 8:00, when it drops to 0 at once. The server updates it every tick.
