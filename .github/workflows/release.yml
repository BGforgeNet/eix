name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    name: Package and publish the release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      # Creates the release and uploads the package.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build image CI saved from main, read only: a tag's run never writes a cache. xtask uses a loaded image only
      # when it carries the key.
      - name: Key the build image
        id: key
        run: echo "key=eix-build-$INPUTS" >> "$GITHUB_OUTPUT"
        env:
          INPUTS: ${{ hashFiles('build/**', 'rust-toolchain.toml') }}
      - name: Restore the build image
        id: image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/eix-build.tar
          key: ${{ steps.key.outputs.key }}
      - name: Load the build image
        if: steps.image.outputs.cache-hit == 'true'
        run: podman load -q -i "$RUNNER_TEMP/eix-build.tar"
      - name: Gate in the build image
        run: cargo xtask container
        env:
          EIX_IMAGE_KEY: ${{ steps.key.outputs.key }}
      - name: Package
        run: cargo xtask container dist
        env:
          EIX_IMAGE_KEY: ${{ steps.key.outputs.key }}
          EIX_TAG: ${{ github.ref_name }}
      - name: Publish the release
        run: gh release create "$TAG" target/container/dist/*.zip --repo "$GITHUB_REPOSITORY" --verify-tag --title "eix ${TAG#v}" --notes-file target/container/dist/notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
