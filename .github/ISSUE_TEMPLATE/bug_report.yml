name: Bug report
description: A crash, a hang, or something eix does differently from the original addon
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected.
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: eix build
      description: From addon.log, the build in the line that ends in `loaded by the new loader`, for example `eix 0.1.0 (commit 0123456789ab)`.
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Game and mods
      description: EI starter or GOG, the mod, plugins, and DirectDraw wrappers (dgVoodoo, D7VK, Universal Mod).
  - type: textarea
    id: files
    attributes:
      label: Files
      description: >-
        Attach, from the starter's folder: addon.log (the eix build, the system, the loaded modules, every patch group,
        fix and feature, and a crash's record); errors.log, if it is not empty; after a crash, the dump the crash box
        names (Dumps\ei-<date>-<n>.dmp). Also the mod's config.reg and ai.reg, and spelladdon.ini if SpellAddon is on.
    validations:
      required: true
